<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Website Admin</title>
<link rel="icon" href="img/fire-icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f4f7fa">
<script>(function(){var t="",q=(location.search.match(/[?&]theme=(dark|light)/)||[])[1];if(q){try{localStorage.setItem("theme",q)}catch(e){}t=q}else{try{t=localStorage.getItem("theme")||""}catch(e){}}if(t!=="dark"&&t!=="light")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.dataset.theme=t})();</script>
<style>
/* Admin entry. A hidden check asks Google whether this browser is signed in as the owner:
   the owner goes straight to the admin portal, anyone else sees a plain "Unauthorised access" notice. */
:root{--pg:#f4f7fa;--card:#fff;--tx:#0f1722;--mut:#5b6675;--ln:#d0d7e2;--soft:#f1f5fb;--a:#0072B2;--on:#fff;--bad:#b94700;--badbg:rgba(185,71,0,.12);--shade:rgba(10,20,32,.35);color-scheme:light}
:root[data-theme="dark"]{--pg:#0c0a09;--card:#171412;--tx:#f0eae2;--mut:#c2bab0;--ln:rgba(255,238,215,.2);--soft:#221d1a;--a:#e8a33d;--on:#1a1200;--bad:#ff9e5e;--badbg:rgba(255,158,94,.16);--shade:rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--pg);color:var(--tx)}
#site{position:fixed;inset:0;width:100%;height:100%;border:0;filter:blur(28px) saturate(.9);transform:scale(1.12);pointer-events:none}
.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--shade)}
.card{position:relative;width:100%;max-width:400px;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:18px;padding:32px 28px 26px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--mut);font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.x:hover{background:var(--soft);color:var(--tx)}
.x:focus-visible,.btn:focus-visible,.own:focus-visible,.tt:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.sp{width:40px;height:40px;margin:4px auto 14px;border:4px solid var(--ln);border-top-color:var(--a);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp{animation-duration:3s}}
.ic{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--badbg);color:var(--bad)}
.ic svg{width:26px;height:26px}
h1{margin:0 0 8px;font-size:22px}
p{margin:0;color:var(--mut);font-size:15px;line-height:1.5}
.btn{display:inline-block;margin-top:20px;padding:12px 26px;border-radius:999px;background:var(--a);color:var(--on);text-decoration:none;font-weight:bold;font-size:15px}
.btn:hover{filter:brightness(1.07)}
.own{display:inline-block;margin-top:14px;color:var(--mut);font-size:13px}
[hidden]{display:none!important}
.tt{position:fixed;top:14px;right:14px;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
</style>
</head>
<body>
<iframe id="site" src="home" title="" aria-hidden="true" tabindex="-1"></iframe>
<button class="tt" id="tt" type="button"></button>
<div class="wrap">
 <div class="card" id="chk" role="status"><div class="sp"></div><p>Checking your sign-in...</p></div>
 <div class="card" id="no" hidden role="alert">
  <button class="x" type="button" aria-label="Close" title="Close">&times;</button>
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1>Unauthorised access</h1>
  <p>This area is only for the website owner.</p>
  <a class="btn" href="home">Back to the website</a><br>
  <a class="own" id="own" href="#">Website owner? Sign in with Google</a>
 </div>
</div>
<script>
(function () {
  var PORTAL = 'https://script.google.com/macros/s/AKfycbzUnF7q15vyS7JtW5deY2ZZNu4Wi5zGck1bpTJF-CTESDNJuNi7ZT5BH8mnB4W1gt3x/exec?action=go';
  var WHO = 'https://script.google.com/macros/s/AKfycbx4ftUvQ0G2ctvXvvkhwiodbX87pfrSjky8RF_oZxzTygKLmODBvLh-PF8OyzW5EcTk/exec?action=whoami';
  function g(i) { return document.getElementById(i); }
  var root = document.documentElement, mc = document.querySelector('meta[name="theme-color"]');
  function portal() { return PORTAL + '&theme=' + (root.dataset.theme === 'dark' ? 'dark' : 'light'); }
  /* light and dark theme, shared with the rest of the website */
  function paint() { var d = root.dataset.theme === 'dark'; g('tt').textContent = d ? '☀' : '☾'; g('tt').setAttribute('aria-label', d ? 'Switch to light theme' : 'Switch to dark theme'); g('tt').title = g('tt').getAttribute('aria-label'); if (mc) mc.content = d ? '#0c0a09' : '#f4f7fa'; }
  function bg(t) { try { var w = g('site').contentWindow; if (w && w.applyTheme) w.applyTheme(t, false); else if (w) w.document.documentElement.dataset.theme = t; } catch (e) { } }
  g('tt').addEventListener('click', function () { var t = root.dataset.theme === 'dark' ? 'light' : 'dark'; root.dataset.theme = t; try { localStorage.setItem('theme', t); } catch (e) { } paint(); bg(t); });
  window.addEventListener('storage', function (e) { if (e.key === 'theme' && (e.newValue === 'dark' || e.newValue === 'light')) { root.dataset.theme = e.newValue; paint(); bg(e.newValue); } });
  paint();
  /* Google decides who gets into the portal; this link only opens its sign-in */
  g('own').addEventListener('click', function (e) { e.preventDefault(); location.href = portal(); });
  /* close goes back to the website */
  document.querySelector('.x').addEventListener('click', function () {
    var same = false; try { same = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) { }
    if (same && history.length > 1) history.back(); else location.href = 'home';
  });
  /* hidden frame: the site's Apps Script says only whether this browser is signed in to Google as the owner (true or false) */
  var decided = false;
  function deny() { if (decided) return; decided = true; g('chk').hidden = true; g('no').hidden = false; g('no').querySelector('.btn').focus(); }
  window.addEventListener('message', function (e) {
    if (decided || e.origin.indexOf('googleusercontent.com') < 0 || !e.data || e.data.t !== 'whoami') return;
    if (e.data.owner === true) { decided = true; location.replace(portal()); } else deny();
  });
  var fr = document.createElement('iframe'); fr.src = WHO; fr.title = ''; fr.setAttribute('aria-hidden', 'true'); fr.tabIndex = -1;
  fr.style.cssText = 'position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none';
  document.body.appendChild(fr);
  setTimeout(deny, 5000);
})();
</script>
</body>
</html>
