<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Website Admin</title>
<link rel="icon" href="img/avatar-ncmrwf-2.jpg">
<style>
/* Admin entry. The owner email leads to the real admin portal (Google checks the account there).
   Anyone else gets a harmless gag: nothing typed is stored or sent anywhere. */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#f4f7fa;color:#0f1722}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px}
.scr.on{display:flex}
#site{position:fixed;inset:0;width:100%;height:100%;border:0;filter:blur(3px);transform:scale(1.02);pointer-events:none}
#scr1:after{content:"";position:fixed;inset:0;background:rgba(10,20,32,.35)}
.card{position:relative;z-index:1;background:#fff;width:100%;max-width:360px;border-radius:18px;padding:30px 26px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.card h1{margin:0 0 4px;font-size:22px}
.card .s{margin:0 0 18px;color:#5b6675;font-size:14px}
label{display:block;font-size:13px;color:#5b6675;margin:12px 0 5px}
input{width:100%;padding:12px 14px;border:1px solid #d0d7e2;border-radius:10px;font:inherit;font-size:16px;color:#0f1722;background:#fff}
input:focus{outline:2px solid #0072B2;outline-offset:1px}
input.bad{border-color:#b94700;box-shadow:0 0 0 3px rgba(185,71,0,.15)}
.er{min-height:18px;margin:6px 0 0;font-size:13px;color:#b94700}
.btn{margin-top:14px;width:100%;padding:13px;border:0;border-radius:999px;background:#0072B2;color:#fff;font:inherit;font-size:15px;font-weight:bold;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
#scr2{background:#000 url("img/admin-trap.jpg") center/contain no-repeat}
#scr2:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.25)}
#scr3{background:radial-gradient(circle at 70% 30%,#1b2a4a,#0a1420)}
.msg{text-align:center;color:#fff;max-width:440px}
.msg .e{font-size:68px;line-height:1}
.msg h2{font-size:30px;margin:14px 0 8px;font-weight:800}
.msg p{font-size:16px;color:#c6d0dc;margin:0}
.msg a{display:inline-block;margin-top:22px;color:#fff;border:1.5px solid #fff;border-radius:999px;padding:10px 22px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="scr on" id="scr1">
 <iframe id="site" src="home" title="" aria-hidden="true" tabindex="-1"></iframe>
 <form id="f1" class="card" autocomplete="off" novalidate>
  <h1>Website Admin</h1><p class="s">Sign in to open the admin pages.</p>
  <label for="f1e">Email</label><input id="f1e" type="email" inputmode="email" autocomplete="off" placeholder="you@example.com">
  <label for="f1p">Password</label><input id="f1p" type="password" autocomplete="new-password" placeholder="Password">
  <p class="er" id="f1r" role="alert"></p><button class="btn" type="submit">Sign in</button>
 </form>
</div>
<div class="scr" id="scr2" role="img" aria-label="Clickbait, clickbait everywhere">
 <form id="f2" class="card" autocomplete="off" novalidate>
  <h1>Website Admin</h1><p class="s">Enter your email to continue.</p>
  <label for="f2e">Email</label><input id="f2e" type="email" inputmode="email" autocomplete="off" placeholder="you@example.com">
  <p class="er" id="f2r" role="alert"></p><button class="btn" type="submit">Continue</button>
 </form>
</div>
<div class="scr" id="scr3"><div class="msg"><div class="e">&#129318;</div><h2>Why do you wanna get floored?</h2><p>These pages are private. Nothing you typed was saved or sent anywhere.</p><a href="home">Back to the website</a></div></div>
<script>
(function () {
  var OWN = 'anandupiiserk@gmail.com';
  var PORTAL = 'https://script.google.com/macros/s/AKfycbzUnF7q15vyS7JtW5deY2ZZNu4Wi5zGck1bpTJF-CTESDNJuNi7ZT5BH8mnB4W1gt3x/exec?action=go';
  var RE = /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i;
  function g(i) { return document.getElementById(i); }
  function step(f, from, to) {
    g(f).addEventListener('submit', function (e) {
      e.preventDefault();
      var em = g(f + 'e'), pw = g(f + 'p'), r = g(f + 'r'), v = em.value.trim();
      em.classList.remove('bad'); if (pw) pw.classList.remove('bad'); r.textContent = '';
      if (!RE.test(v)) { em.classList.add('bad'); r.textContent = 'Enter a valid email address.'; em.focus(); return; }
      if (pw && !pw.value) { pw.classList.add('bad'); r.textContent = 'Enter your password.'; pw.focus(); return; }
      if (pw) pw.value = '';
      if (f === 'f1' && v.toLowerCase() === OWN) { location.href = PORTAL; return; }
      g(from).classList.remove('on'); g(to).classList.add('on');
      var n = g(to).querySelector('input'); if (n) n.focus();
    });
  }
  step('f1', 'scr1', 'scr2');
  step('f2', 'scr2', 'scr3');
})();
</script>
</body>
</html>
